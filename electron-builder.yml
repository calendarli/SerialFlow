appId: io.github.calendarli.serialflow.desktop
productName: SerialFlow
compression: maximum
electronLanguages:
  - zh-CN
  - en-US
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - resources/icon-v3.png
asarUnpack:
  - '**/*.node'
extraResources:
  - from: resources/firmware/NOTICE.md
    to: firmware/NOTICE.md
  - from: resources/firmware/esp32/${os}-${arch}
    to: firmware/esp32/${os}-${arch}
    filter:
      - '**/*'
      - '!{espefuse,espsecure,esp_rfc2217_server}{,.exe}'
win:
  extraResources:
    - from: resources/virtual-serial/win-${arch}
      to: virtual-serial

  executableName: SerialFlow
  icon: build/icon-v3.ico
  target:
    - nsis
nsis:
  artifactName: SerialFlow-${version}-${arch}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - zh_CN
  displayLanguageSelector: false
  installerIcon: build/icon-v3.ico
  uninstallerIcon: build/icon-v3.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
    - zip
  icon: build/icon-v3.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  # Use PNG directly; falling back to mac.icon downloads/runs the ICNS converter.
  icon: build/icon-v3.png
  syncDesktopName: true
  target:
    - AppImage
    - snap
    - deb
  maintainer: calendarli and kairlec
  category: Utility
appImage:
  # Override global maximum (XZ); mksquashfs runs without progress output.
  compression: gzip
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: calendarli
  repo: SerialFlow
  releaseType: release
